    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-dark': '#0f0720',
              'brand-dark-2': '#1a102e',
              'brand-purple': '#7c3aed',
              'brand-light-purple': '#a78bfa',
              'brand-gray': '#9ca3af',
              'brand-light-gray': '#4b5563',
              // New admin colors
              "primary": "#7c3aed",
              "background-light": "#f6f6f8",
              "background-dark": "#0f0720",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
             typography: ({ theme }) => ({
              invert: {
                css: {
                  '--tw-prose-body': theme('colors.brand-gray'),
                  '--tw-prose-headings': theme('colors.white'),
                  '--tw-prose-lead': theme('colors.brand-light-purple'),
                  '--tw-prose-links': theme('colors.brand-light-purple'),
                },
              },
            }),
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'hero-glow': 'conic-gradient(from 90deg at 50% 50%, #00000000 50%, #7c3aed 100%)',
            }
          },
        },
         plugins: [
            require('@tailwindcss/typography'),
            require('@tailwindcss/forms'),
        ],
      }
    </script>
    <style>
       .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
      html {
        scroll-behavior: smooth;
        color-scheme: dark;
      }
      body {
        background-color: #0f0720;
        background-image: 
          radial-gradient(circle at 50% -20%, #2e1065 0%, transparent 40%),
          radial-gradient(circle at 100% 50%, #1e1b4b 0%, transparent 30%);
        background-attachment: fixed;
        min-height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0720;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #332747;
        border-radius: 10px;
        border: 2px solid #0f0720;
      }
       ::-webkit-scrollbar-thumb:hover {
        background-color: #7c3aed;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.6s ease-out forwards;
      }
      .animate-fadeInUp {
        opacity: 0; /* Start hidden */
        animation: fadeInUp 0.6s ease-out forwards;
      }
      .page-transition {
        animation: fadeIn 0.4s ease-out;
      }
       @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }
      .animate-shimmer {
        background: linear-gradient(to right, #1a102e 8%, #271b3f 18%, #1a102e 33%);
        background-size: 2000px 100%;
        animation: shimmer 1.5s linear infinite;
      }
      
      .glass-panel {
        background: rgba(26, 16, 46, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .text-glow {
        text-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
      }
    </style>

}
</script>
